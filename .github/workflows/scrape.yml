name: X Content Scraper

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TWITTER_COOKIE: ${{ secrets.TWITTER_COOKIE }}
        run: node scraper.mjs

      - name: Commit state
        run: |
          git config user.name "x-scraper-bot"
          git config user.email "scraper@stgblog.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update scraper state [$(date -u '+%Y-%m-%d %H:%M')]"
          git push
